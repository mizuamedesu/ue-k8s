apiVersion: v1
kind: PersistentVolume
metadata:
  name: ue5-game-files-r2-pv
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 10Gi
  storageClassName: rclone
  csi:
    driver: csi-rclone
    volumeHandle: ue5-game-files-r2
    volumeAttributes:
      remote: "r2"
      remotePath: "k8s/LinuxServer"
      secretName: rclone-secret
      vfs-cache-mode: full
      dir-perms: "0777"
      file-perms: "0755"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ue5-game-files-r2-pvc
  namespace: game
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: rclone
  volumeName: ue5-game-files-r2-pv